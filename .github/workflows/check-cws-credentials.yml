name: Verify CWS credentials (read only)
on:
  push:
    branches: [ci/check-cws-credentials]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check token and store access
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          node <<'NODE'
          (async () => {
            for (const key of ['CWS_CLIENT_ID', 'CWS_CLIENT_SECRET', 'CWS_REFRESH_TOKEN', 'CWS_EXTENSION_ID', 'CWS_PUBLISHER_ID']) {
              if (!process.env[key]) throw new Error(`Missing ${key}`);
            }
            const body = new URLSearchParams({client_id: process.env.CWS_CLIENT_ID, client_secret: process.env.CWS_CLIENT_SECRET, refresh_token: process.env.CWS_REFRESH_TOKEN, grant_type: 'refresh_token'});
            const tokenResponse = await fetch('https://oauth2.googleapis.com/token', {method: 'POST', body});
            if (!tokenResponse.ok) throw new Error(`Token exchange HTTP ${tokenResponse.status}`);
            const {access_token} = await tokenResponse.json();
            if (!access_token) throw new Error('Token response missing access token');
            console.log('OAuth token exchange succeeded');
            const publisher = encodeURIComponent(process.env.CWS_PUBLISHER_ID);
            const item = encodeURIComponent(process.env.CWS_EXTENSION_ID);
            const response = await fetch(`https://chromewebstore.googleapis.com/v2/publishers/${publisher}/items/${item}:fetchStatus`, {headers: {Authorization: `Bearer ${access_token}`}});
            if (!response.ok) {
              const data = await response.json().catch(() => ({}));
              const reasons = (data.error?.details || []).map(d => d.reason).filter(r => typeof r === 'string' && /^[A-Z_]+$/.test(r));
              let message = String(data.error?.message || 'not provided');
              for (const secret of [...Object.values(process.env).filter(v => v && v.length >= 4), access_token]) message = message.split(secret).join('[redacted]');
              console.log(`Google detail: ${message}`);
              throw new Error(`Store status HTTP ${response.status}; reason: ${reasons.join(', ') || 'not provided'}`);
            }
            const status = await response.json();
            if (!status.publishedItemRevisionStatus?.distributionChannels?.every(c => typeof c.crxVersion === 'string') || !status.publishedItemRevisionStatus.distributionChannels.length) throw new Error('Published version missing from status');
            console.log('Store access succeeded; published version available');
          })().catch(error => {console.error(error.message); process.exitCode = 1;});
          NODE
